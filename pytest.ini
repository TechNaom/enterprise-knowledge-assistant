[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_functions = test_*

# The suite runs fully offline against a deterministic FakeProvider
# (see tests/conftest.py), so no network, model server, or API key is needed.
addopts = -q

# Custom markers used to slice the suite (e.g. `pytest -m "not performance"`).
markers =
    regression: golden-set retrieval quality guards
    performance: latency / timing checks
